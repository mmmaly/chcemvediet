name: Testing project
on:
  push:
  pull_request:
jobs:
  build:
    # The same system and Python as the production server.
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: pip
        cache-dependency-path: requirements/*.txt
    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y gettext libmysqlclient-dev pkg-config
        pip install -r requirements/base.txt -r requirements/local.txt -r requirements/tests.txt
    - name: Download Fontello icons and compile translations
      run: |
        python fontello/fontello.py
        python manage.py compilemessages --settings=chcemvediet.settings_tests
    - name: Run tests
      # chcemvediet.settings_tests: SQLite, file cache, no mail, LibreOffice/ImageMagick/OCR mocked.
      run: |
        python manage.py test --settings=chcemvediet.settings_tests --noinput
